# Install required NTFk, Ipopt, and Mads tools.
before_script:
  - apt-get update
  - apt-get install -y wget git gcc gfortran g++ make patch bzip2 hdf5-tools zlib1g-dev

stages:
  - test
  - postprocess

variables:
  JULIA_DEPOT_PATH: "$CI_PROJECT_DIR/.julia"

.test_template: &test_definition
  script:
    - julia --startup-file=no --project=. -e 'import Pkg; Pkg.instantiate(); Pkg.test(; coverage=true)'
  artifacts:
    paths:
      - src/*.cov
      - test/*.cov

"test:1.12":
  stage: test
  image: julia:1.12
  <<: *test_definition

coverage:
  stage: postprocess
  allow_failure: true
  image: julia:1.12
  dependencies:
    - "test:1.12"
  script:
    - julia --startup-file=no -e 'import Pkg; Pkg.add("Coverage")'
    - julia --startup-file=no -e 'import Coverage; covered, total = Coverage.get_summary(Coverage.process_folder()); println("(", covered / total * 100, "%) covered")'
  coverage: '/\(\d+.\d+%\) covered/'
